<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPA Model Prices</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #333;
      background: #f5f7fa;
    }

    .header {
      background: #3b82f6;
      color: #fff;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: bold;
    }

    .header .subtitle {
      font-size: 11px;
      font-weight: normal;
      opacity: 0.85;
      margin-top: 2px;
    }

    .notice {
      background: #fef9c3;
      border-left: 3px solid #eab308;
      color: #854d0e;
      font-size: 12px;
      padding: 8px 12px;
      margin: 10px 12px 0;
      border-radius: 4px;
    }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-row input {
      flex: 1;
    }

    .btn-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #f0f4ff;
      color: #3b82f6;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      padding: 0;
    }

    .btn-icon:hover {
      background: #dbeafe;
    }

    .section {
      background: #fff;
      margin: 12px;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 13px;
      color: #555;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #3b82f6;
    }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .btn:not(:disabled):hover {
      opacity: 0.88;
    }

    .status {
      font-size: 12px;
      min-height: 18px;
      margin-top: 8px;
      padding: 0 2px;
    }

    .status.success { color: #16a34a; }
    .status.error   { color: #dc2626; }
    .status.info    { color: #666; }
  </style>
</head>
<body>
  <div class="header">
    CPA Model Prices
    <div class="subtitle">管理 CPA 模型价格数据</div>
  </div>

  <div class="notice">
    请在 CPA 管理页面中使用本插件
  </div>

  <!-- 同步价格 -->
  <div class="section">
    <div class="section-title">同步模型价格</div>
    <div class="form-group">
      <label for="filterInput">筛选关键词（可选，多个用逗号或空格分隔）</label>
      <textarea id="filterInput" rows="2" placeholder="例如：gpt claude gemini"></textarea>
    </div>
    <div class="form-group">
      <label for="manualKeyInput">管理密钥（自动读取失败时必填）</label>
      <div class="input-row">
        <input type="password" id="manualKeyInput" placeholder="输入管理密钥" />
        <button class="btn-icon" id="toggleKeyBtn" title="显示/隐藏密钥">&#x1F441;</button>
        <button class="btn-icon" id="loadKeyBtn" title="从页面自动读取管理密钥">&#x21BB;</button>
      </div>
    </div>
    <button class="btn btn-primary" id="syncBtn">更新模型价格</button>
    <div class="status info" id="syncStatus"></div>
  </div>

  <!-- 清除价格 -->
  <div class="section">
    <div class="section-title">清除价格数据</div>
    <button class="btn btn-danger" id="clearBtn">清除模型价格</button>
    <div class="status info" id="clearStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
